name: adaptive_actions
description: Adaptive action placement with Material and Cupertino renderers for Flutter.
version: 0.6.0
homepage: https://github.com/FriesI23/adaptive_actions
repository: https://github.com/FriesI23/adaptive_actions
issue_tracker: https://github.com/FriesI23/adaptive_actions/issues

topics:
  - flutter
  - adaptive-ui
  - material-design
  - cupertino
  - responsive-ui

screenshots:
  - description: Material actions adapting to the available width.
    path: screenshots/material-adaptive-actions.webp
  - description: Cupertino actions adapting to the available width.
    path: screenshots/apple-adaptive-actions.webp
  - description: Material nested menu hierarchy preserved in overflow.
    path: screenshots/material-nested-overflow.webp
  - description: Cupertino nested menu hierarchy preserved in overflow.
    path: screenshots/apple-nested-overflow.webp
  - description: Custom primary action and overflow trigger builders.
    path: screenshots/custom-button-builders.webp
  - description: Nested Cupertino menus adapting to RTL directionality.
    path: screenshots/rtl-nested-menu.webp

environment:
  sdk: ^3.11.5
  flutter: '>=3.44.0'

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

